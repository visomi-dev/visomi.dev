# Used together with compose.yaml, always with a unique test project and synthetic env file.
services:
  postgres:
    container_name: '${COMPOSE_PROJECT_NAME}-postgres'
    # Each fixture initializes and discards a cluster. Keep its data and WAL off the shared build disk.
    environment:
      PGDATA: /var/lib/postgresql/fixture/data
    tmpfs:
      - /var/lib/postgresql/fixture:size=256m
  redis:
    container_name: '${COMPOSE_PROJECT_NAME}-redis'
  app:
    build:
      target: test-runtime
    environment:
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: '2525'
      SMTP_FROM: auth@example.test
      SMTP_ALLOW_INSECURE_LOCAL: 'true'
      NODE_ENV: test
      DISABLE_WORKER: 'true'
      OWNER_EMAIL: owner@example.test
      AUTH_TRUST_PROXY: ''
      NODE_OPTIONS: --require /workspace/${VISOMI_TEST_APP_ROOT}/e2e/support/telemetry-preload.cjs
      VISOMI_E2E_CONTAINER: 'true'
      VISOMI_E2E_TELEMETRY_DIR: /workspace/tmp/container-telemetry
    volumes:
      - '${VISOMI_TEST_TELEMETRY_DIR}:/workspace/tmp/container-telemetry:Z'
    stop_grace_period: 6s
