<div class="flex min-h-dvh flex-col bg-zinc-50 text-zinc-950 dark:bg-zinc-950 dark:text-zinc-50">
  <header class="mx-auto flex w-full max-w-7xl flex-wrap items-center justify-between gap-4 px-5 py-5 sm:px-8">
    <a href="/" class="ui-focus-ring inline-flex min-h-11 items-center rounded-lg"
      ><img
        ngSrc="brand/logotype.svg"
        alt="VISOMI.DEV"
        width="175"
        height="36"
        priority
        class="h-9 w-44 object-contain dark:invert"
    /></a>

    <app-preferences />
  </header>

  <main class="flex flex-1 items-center justify-center px-5 py-8 sm:py-14">
    <section
      class="w-full max-w-md space-y-6 rounded-xl border border-zinc-200 bg-white p-6 shadow-sm sm:p-8 dark:border-zinc-700 dark:bg-zinc-900"
    >
      <header class="space-y-3">
        <h1 appNavigationHeading class="font-heading text-2xl font-semibold" tabindex="-1" i18n="@@signInHeroTitle">
          Owner sign-in
        </h1>

        <p class="text-sm leading-6 text-zinc-600 dark:text-zinc-300" i18n="@@dashboardAccessDenied">
          Owner access required.
        </p>
      </header>

      @if (failed()) {
        <p role="alert" i18n="@@dashboardAccessError">Access could not be verified. Please try again.</p>
      }

      @if (challenge()) {
        <form class="space-y-5" (ngSubmit)="verify()">
          <label class="block" for="code" i18n="@@dashboardAccessCode">Verification code</label>

          <input
            class="w-full rounded-lg border border-zinc-300 bg-white p-3 dark:border-zinc-600 dark:bg-zinc-950"
            id="code"
            name="code"
            autocomplete="one-time-code"
            [ngModel]="code()"
            (ngModelChange)="code.set($event)"
            required
          />

          <button
            class="min-h-11 w-full rounded-lg bg-blue-700 px-5 py-3 font-semibold text-white disabled:opacity-50 dark:bg-blue-600"
            [disabled]="busy()"
            type="submit"
            [attr.aria-busy]="busy()"
          >
            @if (busy()) {
              <span
                aria-hidden="true"
                class="mr-2 inline-block size-4 animate-spin rounded-full border-2 border-current border-r-transparent motion-reduce:animate-none"
              ></span>
            }

            <span i18n="@@dashboardAccessVerify">Verify access</span>
          </button>
        </form>

        <button
          type="button"
          class="min-h-11 w-full text-sm underline"
          (click)="restart()"
          i18n="@@signInVerifyRestart"
        >
          Start again
        </button>
      } @else {
        <form class="space-y-5" (ngSubmit)="signIn()">
          <label class="block" for="email" i18n="@@dashboardAccessEmail">Verified email</label>

          <input
            class="w-full rounded-lg border border-zinc-300 bg-white p-3 dark:border-zinc-600 dark:bg-zinc-950"
            id="email"
            name="email"
            type="email"
            autocomplete="username"
            [ngModel]="email()"
            (ngModelChange)="email.set($event)"
            required
          />

          <label class="block" for="password" i18n="@@dashboardAccessPassword">Password</label>

          <input
            class="w-full rounded-lg border border-zinc-300 bg-white p-3 dark:border-zinc-600 dark:bg-zinc-950"
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            [ngModel]="password()"
            (ngModelChange)="password.set($event)"
            required
          />

          <button
            class="min-h-11 w-full rounded-lg bg-blue-700 px-5 py-3 font-semibold text-white disabled:opacity-50 dark:bg-blue-600"
            [disabled]="busy()"
            type="submit"
            [attr.aria-busy]="busy()"
          >
            @if (busy()) {
              <span
                aria-hidden="true"
                class="mr-2 inline-block size-4 animate-spin rounded-full border-2 border-current border-r-transparent motion-reduce:animate-none"
              ></span>
            }

            <span i18n="@@dashboardAccessSignIn">Access dashboard</span>
          </button>
        </form>
      }

      @if (busy()) {
        <p role="status" i18n="@@dashboardAccessLoading">Verifying access…</p>
      }
    </section>
  </main>

  <footer class="px-5 pb-6 text-center text-xs text-zinc-600 dark:text-zinc-400" i18n="@@signInFooterLabel">
    Private administration · VISOMI.DEV
  </footer>
</div>
