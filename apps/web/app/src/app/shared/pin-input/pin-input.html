<div
  class="relative rounded-lg text-zinc-950 has-focus-visible:outline-2 has-focus-visible:outline-offset-3 has-focus-visible:outline-blue-600 has-disabled:opacity-50 dark:text-zinc-50 dark:has-focus-visible:outline-blue-400"
  dir="ltr"
>
  <input
    #control
    type="password"
    inputmode="numeric"
    autocapitalize="off"
    [spellcheck]="false"
    [attr.autocomplete]="autocomplete()"
    [minLength]="minDigits()"
    [maxLength]="digits()"
    [pattern]="pattern()"
    data-slot="control"
    class="absolute inset-0 size-full rounded-lg bg-transparent px-0.5 font-mono text-transparent caret-zinc-950 outline-hidden selection:text-transparent disabled:cursor-not-allowed dark:caret-zinc-50 forced-colors:caret-[CanvasText]"
    [id]="field.controlId()"
    [attr.aria-describedby]="field.describedBy()"
    [attr.aria-invalid]="field.invalid() || !!field.manualError()?.trim() || null"
    [required]="required()"
    [disabled]="disabled()"
    (input)="valueChange.emit(control.value)"
    (paste)="paste($event)"
  />

  <div
    aria-hidden="true"
    class="pointer-events-none relative grid grid-cols-[repeat(var(--digits),minmax(0,1fr))] gap-[min(0.25rem,1.5cqi)]"
  >
    @for (slot of slots(); track slot) {
      <span class="slot grid h-11 min-w-0 place-items-center rounded-lg border">
        @if (slot < value().length) {
          <span data-slot="mask" class="size-1 rounded-full border-2 border-current"></span>
        }
      </span>
    }
  </div>
</div>
