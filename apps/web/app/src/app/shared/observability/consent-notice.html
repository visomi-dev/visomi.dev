@if (visible()) {
  <section
    appUI="card"
    layout="plain"
    padding="sm"
    [attr.aria-label]="copy.title"
    class="my-4 grid w-full max-w-sm gap-2 text-start text-sm"
  >
    <p appUI uiSize="sm">{{ copy.invitation }}</p>

    <div class="grid w-fit max-w-full grid-cols-2 gap-2">
      <button appUI type="button" variant="secondary" size="sm" (click)="choose(false)">{{ copy.reject }}</button>

      <button appUI type="button" variant="secondary" size="sm" [disabled]="blocked()" (click)="choose(true)">
        {{ copy.accept }}
      </button>
    </div>

    <a appUI class="justify-self-start" [href]="copy.privacyUrl">{{ copy.purpose }}</a>

    <p role="status" class="empty:hidden">{{ feedback() }}</p>
  </section>
}
